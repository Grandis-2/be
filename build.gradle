// 루트는 빌드 컨테이너로만 쓴다.
plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.grandis.nova'
    version = '0.0.1-SNAPSHOT'
}

// Spring Boot BOM 이 관리하지 않는 라이브러리 버전. 올릴 때 여기만 바꾼다.
ext {
    awsSdkVersion = '2.55.6'
    flociTestcontainersVersion = '2.16.1'
    resilience4jVersion = '2.4.0'
}

subprojects {
    // common 처럼 소스가 없는 중간 컨테이너는 건너뛴다. 붙이면 빈 jar 가 만들어진다.
    if (!file('src').isDirectory()) {
        return
    }

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories { mavenCentral() }

    dependencyManagement {
        // 뒤에 가져온 BOM 이 이긴다. Spring Cloud AWS 가 함께 고정하는 메일 등은 Boot 가, AWS SDK 는 맨 뒤 SDK BOM 이 정한다
        imports {
            mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:4.2.0'
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        }
    }

    // 운영 설정은 Parameter Store 에서 읽는다(jar 에 application.yml 이 없다). 서비스(부트 모듈)만 — common 라이브러리에는 붙이지 않는다
    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation project(':common:aws')
        }

        // 서비스 버전은 jar 의 두 곳에 같은 값으로 든다. release 는 판정 뒤 새로 올릴 서비스만 -PreleaseVersion.<서비스>=0.0.N 으로 다시 만든다.
        //   META-INF/build-info.properties 의 build.version — OTel 에이전트의 service.version(SpringBootServiceVersionDetector) · actuator info
        //   MANIFEST 의 Implementation-Version — spring.application.version, 곧 콘솔 ECS 로그의 service.version · 시작 로그
        // GIT_SHA 는 build.commit(actuator info.build.commit)이 된다. 둘 다 없으면(로컬 · PR) 프로젝트 버전만 든다. 태스크 정의 · 환경 변수는 바꾸지 않는다.
        // release 의 jar 키는 build-info 를 빼고 MANIFEST 의 버전은 프로젝트 버전으로 되돌려 해시한다(.github/scripts/jar_content_key.py).
        // build-info 의 time 을 빼야 jar 가 재현 가능하게 남는다.
        def serviceVersion = providers.gradleProperty("releaseVersion.${project.name}").orElse(project.version.toString())
        springBoot {
            buildInfo {
                excludes = ['time']
                properties {
                    version = serviceVersion
                    additional.put('commit', providers.environmentVariable('GIT_SHA'))
                }
            }
        }
        tasks.named('bootJar') {
            manifest {
                attributes('Implementation-Version': serviceVersion)
            }
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') { useJUnitPlatform() }
}

// ── CI 용 모듈 목록과 의존 그래프 ─────────────────────────────────────────
// 시험할 모듈 고르기(바뀐 파일 → 모듈)와 이미지로 만들 서비스 목록을 CI 가 여기서 읽어 간다.
// 경로 규칙을 워크플로 YAML 에 복사해두면 반드시 썩고, 썩어도 조용히 틀린다.
tasks.register('serviceGraph') {
    description = 'CI 가 쓰는 모듈 의존 그래프를 JSON 으로 출력한다'
    group = 'ci'

    doLast {
        // 프로젝트 경로(:common:web) → 디렉터리(common/web).
        // 바뀐 파일이 어느 모듈 소유인지 되짚을 때 쓴다.
        def dirs = [:]
        rootProject.subprojects.each { p ->
            dirs[p.path] = rootProject.projectDir.toPath()
                    .relativize(p.projectDir.toPath()).toString()
        }

        // 한 프로젝트가 직접 선언한 프로젝트 의존만 모은다.
        def directDeps = { Project p ->
            def out = [] as TreeSet
            p.configurations.each { c ->
                c.dependencies.withType(ProjectDependency).each { d -> out << d.path }
            }
            out
        }

        // 서비스 = 부트 플러그인이 붙은 모듈. 목록을 손으로 적지 않는다.
        def services = rootProject.subprojects
                .findAll { it.plugins.hasPlugin('org.springframework.boot') }
                .collect { it.name }
                .toSorted()

        // 테스트 매트릭스용. 소스가 있는 모듈만 — 빈 컨테이너는 돌릴 게 없다.
        def modules = rootProject.subprojects
                .findAll { new File(it.projectDir, 'src').isDirectory() }
                .collect { it.path }
                .toSorted()

        // 모듈마다 자기 전이 의존을 닫아 둔다. common 끼리 물고 물려도 알아서 따라간다.
        // 바뀐 모듈이 이 목록에 있으면 그 모듈을 다시 테스트해야 한다.
        def closures = [:]
        modules.each { path ->
            def closed = [] as TreeSet
            def queue = [path]
            while (queue) {
                def cur = queue.remove(0)
                if (!closed.add(cur)) continue
                queue.addAll(directDeps(rootProject.project(cur)))
            }
            closures[path] = closed.toList()
        }

        // version 은 프로젝트 버전이다. release 의 jar 키가 MANIFEST 의 버전을 이 값으로 되돌려 해시한다(.github/scripts/jar_content_key.py).
        def json = groovy.json.JsonOutput.toJson(
                [projects: dirs, services: services, modules: modules, closures: closures, version: rootProject.version.toString()])
        def out = new File(rootProject.buildDir, 'service-graph.json')
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(json)
        println json
    }
}
