// 루트는 빌드 컨테이너로만 쓴다.
plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.grandis.nova'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    // common 처럼 소스가 없는 중간 컨테이너는 건너뛴다. 붙이면 빈 jar 가 만들어진다.
    if (!file('src').isDirectory()) {
        return
    }

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories { mavenCentral() }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') { useJUnitPlatform() }
}

// ── CI 변경 감지용 의존 그래프 ────────────────────────────────────────────
// release 워크플로가 "무엇을 다시 빌드할지" 정할 때 쓴다.
// 경로 규칙을 워크플로 YAML 에 복사해두면 반드시 썩고, 썩어도 조용히 틀린다.
// 그래서 build.gradle 을 유일한 진실로 두고 CI 가 매번 여기서 읽어 간다.
tasks.register('serviceGraph') {
    description = 'CI 가 쓰는 모듈 의존 그래프를 JSON 으로 출력한다'
    group = 'ci'

    doLast {
        // 프로젝트 경로(:common:web) → 디렉터리(common/web).
        // 바뀐 파일이 어느 모듈 소유인지 되짚을 때 쓴다.
        def dirs = [:]
        rootProject.subprojects.each { p ->
            dirs[p.path] = rootProject.projectDir.toPath()
                    .relativize(p.projectDir.toPath()).toString()
        }

        // 한 프로젝트가 직접 선언한 프로젝트 의존만 모은다.
        def directDeps = { Project p ->
            def out = [] as TreeSet
            p.configurations.each { c ->
                c.dependencies.withType(ProjectDependency).each { d -> out << d.path }
            }
            out
        }

        // 서비스 = 부트 플러그인이 붙은 모듈. 목록을 손으로 적지 않는다.
        def services = [:]
        rootProject.subprojects
                .findAll { it.plugins.hasPlugin('org.springframework.boot') }
                .each { svc ->
            // 전이 의존까지 닫는다. common 끼리 물고 물려도 알아서 따라간다.
            def closed = [] as TreeSet
            def queue = [svc.path]
            while (queue) {
                def path = queue.remove(0)
                if (!closed.add(path)) continue
                queue.addAll(directDeps(rootProject.project(path)))
            }
            services[svc.name] = closed.toList()
        }

        // 테스트 매트릭스용. 소스가 있는 모듈만 — 빈 컨테이너는 돌릴 게 없다.
        def modules = rootProject.subprojects
                .findAll { new File(it.projectDir, 'src').isDirectory() }
                .collect { it.path }
                .toSorted()

        // 모듈마다 자기 전이 의존을 닫아 둔다. 서비스가 아닌 common 모듈도 포함한다.
        // 바뀐 모듈이 이 목록에 있으면 그 모듈을 다시 테스트해야 한다.
        def closures = [:]
        modules.each { path ->
            def closed = [] as TreeSet
            def queue = [path]
            while (queue) {
                def cur = queue.remove(0)
                if (!closed.add(cur)) continue
                queue.addAll(directDeps(rootProject.project(cur)))
            }
            closures[path] = closed.toList()
        }

        def json = groovy.json.JsonOutput.toJson(
                [projects: dirs, services: services, modules: modules, closures: closures])
        def out = new File(rootProject.buildDir, 'service-graph.json')
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(json)
        println json
    }
}
