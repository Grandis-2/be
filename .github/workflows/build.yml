name: build

on:
  pull_request:
    branches: [dev, 'epic/**']   # main 은 promote.yml 만 옮긴다 — main 으로 가는 PR 은 없다
  # dev 푸시는 promote.yml 이 이 워크플로를 불러 검사하고, 통과하면 main 으로 옮긴다
  workflow_call:

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. 러너 시간을 아낀다.
# 그룹 이름을 적어 둔다 — 불려 돌 때 github.workflow 는 부른 쪽(promote) 이름이라 database 와 같은 그룹이 되어 서로 취소한다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 읽기만 한다. 기본 토큰 권한이 read/write 여도 이 워크플로는 저장소에 쓰지 않는다.
permissions:
  contents: read

jobs:
  # 어떤 모듈이 있고 무엇이 바뀌었는지 build.gradle 에게 묻는다. 목록을 여기 적지 않는다.
  # 모듈을 추가하면 테스트 잡이 알아서 하나 늘어난다.
  graph:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.g.outputs.modules }}
      any: ${{ steps.g.outputs.any }}
      services: ${{ steps.g.outputs.services }}
      otel: ${{ steps.g.outputs.otel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 기준 커밋과 비교해야 한다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - id: g
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ./gradlew serviceGraph -q --no-daemon > /dev/null

          # PR 은 대상 브랜치와, 승격 관문(promote.yml)은 main 과 비교한다. 직전 dev 커밋과 비교하면
          # 관문이 대기 중에 건너뛴 커밋의 변경이 검사 없이 main 으로 간다.
          # 기준을 못 찾으면 전부 돌린다. 애매할 때 많이 돌리는 쪽이 누락보다 안전하다.
          [ -n "$BASE" ] || BASE=$(git rev-parse -q --verify origin/main || true)
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::비교 기준을 찾을 수 없다. 전체를 테스트한다."
            list=$(jq -c '.modules' build/service-graph.json)
            echo "otel=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "${{ github.sha }}" > changed.txt
            list=$(python3 .github/scripts/affected.py build/service-graph.json changed.txt)
            # 끈 OTel 계측의 검사(otel 잡)를 바꾸는 파일 — 서비스 코드가 안 바뀌어도 돌린다
            grep -qE '^(docker/otel/|docker/Dockerfile$|\.github/scripts/otel_agent_config\.py$)' changed.txt \
              && echo "otel=true" >> "$GITHUB_OUTPUT" || echo "otel=false" >> "$GITHUB_OUTPUT"
          fi

          echo "modules=$list" >> "$GITHUB_OUTPUT"
          [ "$(echo "$list" | jq 'length')" -gt 0 ] \
            && echo "any=true" >> "$GITHUB_OUTPUT" \
            || echo "any=false" >> "$GITHUB_OUTPUT"
          # 영향받는 모듈 중 서비스(이미지가 되는 것)가 있는가 — AOT 학습 검증을 돌릴지 정한다.
          # 대입으로 먼저 받아 jq 실패가 set -e 에 걸리게 한다(echo 인자 안이면 빈 값으로 aot · otel 잡을 조용히 건너뛴다)
          services=$(jq -r --argjson m "$list" \
            '[.serviceModules[].path] - ([.serviceModules[].path] - $m) | length > 0' build/service-graph.json)
          echo "services=$services" >> "$GITHUB_OUTPUT"

          {
            echo "## 테스트 대상"
            echo '```'
            echo "$list" | jq -r '.[]' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 모듈마다 잡이 하나씩 뜬다. 빨간불이 뜬 잡 이름이 곧 깨진 모듈이다.
  # 로그를 열어 어디서 깨졌는지 찾을 필요가 없다.
  test:
    needs: graph
    if: needs.graph.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 한 모듈이 깨져도 나머지 결과를 다 본다
      matrix:
        module: ${{ fromJSON(needs.graph.outputs.modules) }}
    name: test ${{ matrix.module }}
    # common:security 의 폐기 조회 테스트가 아래 Redis(6379) 에 붙는다. 서비스가 없으면 skip 이 아니라 실패한다
    # (CI 환경변수가 있으면 AssertionError) — 초록인데 테스트가 안 돈 상태를 막기 위해서다.
    # member 는 테스트가 Testcontainers 로 자기 MySQL·Redis 를 띄우므로 이 서비스도 아래 스키마 단계도 쓰지 않는다.
    # 모듈마다 컨테이너가 뜨지만 안 쓰는 모듈에는 비용이 몇 초뿐이다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # 스키마는 정본(flyway-project/migrations)을 버전 순으로 그대로 적용한다. 파일 이름의 버전이 12자리 고정이라 이름순이 곧 적용 순서다.
      # Flyway 이력 · 검증은 database 워크플로가 한다 — 여기서는 모듈 잡마다 Flyway 이미지를 받지 않으려고 mysql 로 바로 넣는다.
      # 연결 문자셋을 utf8mb4 로 못 박는다. 클라이언트 기본이 latin1 이면 CHECK 의 문자열 상수가 _latin1 로 저장돼 Flyway 결과와 달라진다.
      # 테스트 계정 nova/nova-local 은 여기서 만든다.
      - name: apply schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE shop DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          for migration in $(ls flyway-project/migrations/V*.sql | sort); do
            mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 shop < "$migration"
          done
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE USER 'nova'@'%' IDENTIFIED BY 'nova-local'; GRANT ALL ON shop.* TO 'nova'@'%'; GRANT ALL ON external_mock.* TO 'nova'@'%';"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew ${{ matrix.module }}:build --no-daemon

      # 초록과 별개로 "테스트가 정말 돌았는가" 를 본다. 테스트 소스가 있는 모듈인데 결과 XML 이 없거나, 합계가 0 이거나,
      # skipped 가 있으면 실패다 — 인프라 전제가 빠져 assumeTrue 로 건너뛴 것을 초록으로 두지 않는다. 테스트 소스가 없는 모듈은 통과.
      - name: test summary
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          module = os.environ['MODULE']
          # 경로 → 디렉터리는 기본 배치(serviceGraph 의 projects 와 같다). 모듈 디렉터리를 옮겨 틀리면 "테스트 없음" 으로 통과하지 않게 멈춘다
          d = module.strip(':').replace(':', '/')
          if not os.path.isdir(d):
              print(f'::error::{module} 의 디렉터리 {d} 가 없다 — projectDir 를 옮겼으면 이 단계가 serviceGraph 의 projects 를 읽게 고친다')
              sys.exit(1)
          has_tests = os.path.isdir(os.path.join(d, 'src', 'test'))
          files = glob.glob(f'{d}/build/test-results/test/*.xml')
          tot = {'tests': 0, 'skipped': 0, 'failures': 0, 'errors': 0}
          unparsed = []
          for f in files:
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(f).read())
              if not m:
                  unparsed.append(f); continue
              for k, v in zip(tot, m.groups()): tot[k] += int(v)
          print('TEST SUMMARY', module, tot, 'files=%d has_tests=%s unparsed=%s' % (len(files), has_tests, unparsed))
          if has_tests and (not files or tot['tests'] == 0 or tot['skipped'] > 0 or unparsed):
              print('::error::테스트 소스가 있는데 결과가 비었거나 skipped 가 있다 — MySQL·Redis 서비스와 스키마 적용을 확인하라')
              sys.exit(1)
          PY

      # 실패해도 리포트는 남긴다. 어느 테스트가 깨졌는지 보려면 이게 필요하다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ strategy.job-index }}
          path: '**/build/reports/tests/'
          retention-days: 7

  # release 가 쓰는 스크립트(.github/scripts)의 시험. 버전 판정 · jar 키가 여기서 깨지면 release 에서 번호가 틀린다.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # 필수 체크로 거는 고정 이름. 매트릭스 잡 이름은 변경분에 따라 들쭉날쭉하므로
  # 여기 하나로 모은다. 돌릴 모듈이 없으면 통과다. 스크립트 시험도 여기서 함께 본다.
  tests:
    needs: [graph, test, scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 매트릭스 결과 판정
        run: |
          set -euo pipefail
          echo "graph=${{ needs.graph.result }} test=${{ needs.test.result }} scripts=${{ needs.scripts.result }}"
          [ "${{ needs.graph.result }}" = "success" ] \
            || { echo "::error::의존 그래프 추출이 실패했다"; exit 1; }
          [ "${{ needs.scripts.result }}" = "success" ] \
            || { echo "::error::스크립트 시험(.github/scripts)이 실패했다"; exit 1; }
          case "${{ needs.test.result }}" in
            success)  echo "테스트 통과" ;;
            skipped)  echo "테스트할 모듈이 없다" ;;
            *)        echo "::error::테스트가 실패했다. 빨간불이 뜬 잡 이름이 깨진 모듈이다"; exit 1 ;;
          esac

  # 이미지의 AOT 캐시 학습(docker/aot-training)을 main 승격 전에 미리 돌려 본다. 이미지를 올리지 않는다.
  # 학습 시나리오는 실제 API 를 부르므로 API 가 바뀌면 깨진다 — release 가 운영 DB 를 마이그레이션한 뒤가 아니라 승격 전에 빨개지게 한다.
  # 서비스를 모두 띄워 10분 남짓 걸려 PR 에서는 돌리지 않고 promote.yml 이 부를 때만 돈다. 서비스가 영향받지 않으면 건너뛴다.
  aot:
    needs: graph
    if: github.event_name != 'pull_request' && needs.graph.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # PR 코드(gradlew · train.sh)를 실행한다 — 토큰을 git 설정에 남기지 않는다
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: jar 만들기
        run: |
          set -euo pipefail
          ./gradlew serviceGraph -q --no-daemon > /dev/null
          jq -r '.serviceModules[].path + ":bootJar"' build/service-graph.json | xargs -r ./gradlew --no-daemon
          for s in $(jq -r '.services[]' build/service-graph.json); do
            dir=$(jq -er --arg s "$s" '.serviceModules[$s].dir' build/service-graph.json)
            jar=$(ls "$dir"/build/libs/*.jar | grep -v -- '-plain.jar$')
            mkdir -p "dist/$s"
            cp "$jar" "dist/$s/app.jar"
            # 학습 컨테이너가 붙이는 설정(train.sh)
            cp "$dir/src/main/resources/application.yml.example" "dist/$s/"
          done

      - name: 학습 · 검증
        env:
          FINAL_REPO: aot-check
        run: SUMMARY="$GITHUB_STEP_SUMMARY" docker/aot-training/train.sh

  # 끈 OTel 계측(docker/otel/agent.properties)을 다시 켜야 하는지 본다. 서비스 이미지에 그 라이브러리가 실리거나,
  # main 소스가 그 기능을 쓰기 시작하거나, 에이전트를 올려 계측 이름이 바뀌면 실패한다 — 사람이 기억하지 않아도 되게.
  # 선언이 아니라 실제로 실리는 것(bootJar 의 BOOT-INF/lib)을 봐서 간접 의존성도 잡는다. 내용은 .github/scripts/otel_agent_config.py.
  otel:
    needs: graph
    if: needs.graph.outputs.services == 'true' || needs.graph.outputs.otel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4

      - name: jar 만들기
        run: |
          set -euo pipefail
          ./gradlew serviceGraph -q --no-daemon > /dev/null
          jq -r '.serviceModules[].path + ":bootJar"' build/service-graph.json | xargs -r ./gradlew --no-daemon
          for s in $(jq -r '.services[]' build/service-graph.json); do
            dir=$(jq -er --arg s "$s" '.serviceModules[$s].dir' build/service-graph.json)
            jar=$(ls "$dir"/build/libs/*.jar | grep -v -- '-plain.jar$')
            mkdir -p "dist/$s"
            cp "$jar" "dist/$s/app.jar"
          done

      - name: 끈 계측 확인
        run: python3 .github/scripts/otel_agent_config.py dist

      # 실제 bootJar 에서 release 의 jar 키를 계산해 본다(.github/scripts/jar_content_key.py) — build-info 위치가 바뀌었거나,
      # MANIFEST 의 Implementation-Version 이 Boot 가 두던 자리 · 값이 아니면 빨개진다(키 스크립트의 가정이 깨짐).
      # 이 잡은 PR 필수 체크가 아니라 머지는 막지 않는다. 승격(promote.yml)이 build 전체를 기다려 main · release 로는 가지 않고,
      # release 의 판정도 같은 검사(--unversioned)를 한다.
      - name: jar 키 계산
        run: |
          set -euo pipefail
          base=$(jq -er .version build/service-graph.json)
          for jar in dist/*/app.jar; do
            # 대입으로 먼저 받아 스크립트 실패가 set -e 에 걸리게 한다
            key=$(python3 .github/scripts/jar_content_key.py "$jar" "$base" --unversioned)
            echo "$jar $key"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 히스토리 전체를 봐야 과거 커밋에 박힌 키도 잡는다

      # .gitignore 는 *.yml 만 막는다. 코드에 하드코딩된 서명 키·카카오 시크릿은 못 막는다.
      # 한 번 푸시되면 히스토리에서 지우는 게 고통스러우므로 들어가기 전에 잡는다.
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose

  # 의존성 취약점 스캔. build.gradle 을 읽어 알려진 CVE 를 찾는다.
  # 지금은 경고만 한다 — 차단하면 우리가 못 고치는 베이스/라이브러리 CVE 로 PR 이 막힌다.
  # 몇 주 돌려 노이즈 양을 본 뒤에 기준을 정한다.
  vulns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: trivy (소스 트리)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln              # secret 은 gitleaks 가 이미 본다
          severity: CRITICAL,HIGH     # MEDIUM 이하까지 켜면 노이즈가 압도한다
          ignore-unfixed: true        # 수정 버전이 없는 건 알려줘도 할 게 없다
          format: table
          exit-code: '0'              # 경고만. 차단은 기준이 잡힌 뒤에.
        env:
          # DB 를 GHCR 에서 받는다. Docker Hub 의 rate limit 을 피한다.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
