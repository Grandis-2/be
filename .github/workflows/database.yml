name: database

on:
  pull_request:
    branches: [dev, 'epic/**']   # main 은 promote.yml 만 옮긴다 — main 으로 가는 PR 은 없다
  # dev 푸시는 promote.yml 이 이 워크플로를 불러 검사한다
  workflow_call:

permissions:
  contents: read

# 그룹 이름을 적어 둔다 — 불려 돌 때 github.workflow 는 부른 쪽(promote) 이름이라 build 와 같은 그룹이 되어 서로 취소한다
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 버전 검사기 테스트
        run: python3 -m unittest discover -s flyway-project -p 'test_*.py'

      - name: 버전 중복 · 기존 파일 불변성 · 신규 버전 순서 검사
        # PR 은 대상 브랜치와, 승격 관문(promote.yml)은 main 과 비교한다 — 관문이 대기 중에 건너뛴 커밋의 변경도 검사한다
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ -n "$BASE_SHA" ]] || BASE_SHA=$(git rev-parse -q --verify origin/main || true)
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python3 flyway-project/migrations.py check --base "$BASE_SHA"
          else
            python3 flyway-project/migrations.py check
          fi

      - name: MySQL 8.4 적용 · 재실행 · 운영 적용 이미지 · 최신 스키마 문서 검증
        run: bash flyway-project/verify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-schema
          path: build/flyway/schema.sql
          retention-days: 7
