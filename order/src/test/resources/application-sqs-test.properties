# Floci 위 SQS 연계 테스트(@SqsIntegrationTest). 주소 · 자격 증명은 SqsTestConfig 가 컨테이너에서 넣는다.
# 발행 전송(transport=sqs)은 SqsIntegrationTest 가 넣는다 — 이 파일 값은 OrderIntegrationTest 의 인라인 transport=log 를 이기지 못한다.
nova.sqs.region=ap-northeast-2
nova.sqs.consumer.enabled=true
# 실패한 메시지가 빨리 다시 보이고 재수신 한도(2회)를 넘겨 DLQ 로 가게 해 시험 시간을 줄인다
nova.sqs.consumer.wait-seconds=5
nova.sqs.consumer.backoff-base=1s
nova.sqs.consumer.backoff-max=1s
nova.sqs.consumer.visibility=2s
