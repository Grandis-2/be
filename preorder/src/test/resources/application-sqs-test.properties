# Floci 위 SQS 연계 테스트(@SqsIntegrationTest). 주소 · 자격 증명은 SqsTestConfig 가 컨테이너에서 넣는다.
nova.outbox.transport=sqs
nova.sqs.region=ap-northeast-2
nova.sqs.consumer.enabled=true
# 기본 호출 제한 시간(3s)보다 길게 — 롱 폴링이 제한 시간에 걸리지 않는지 함께 본다
nova.sqs.consumer.wait-seconds=5
nova.sqs.consumer.backoff-base=1s
nova.sqs.consumer.backoff-max=1s
# 지우지 못한 메시지가 곧 다시 보이게 해, 처리 뒤 삭제됐는지를 "다시 처리되지 않음"으로 확인한다
nova.sqs.consumer.visibility=2s
# DLQ 를 DB 로 옮기는 소비기. 빨리 받고, 적재가 실패하면 곧 다시 받게 짧게 둔다
nova.sqs.dead-letter.enabled=true
nova.sqs.dead-letter.wait-seconds=1
nova.sqs.dead-letter.visibility=2s
# 보류한 메시지는 1초 뒤 다시 받는다(시험이 길어지지 않게). 경보는 시험 중에 남기지 않는다
nova.sqs.consumer.defer-first-delay=1s
nova.sqs.consumer.defer-max-delay=1s
nova.sqs.consumer.defer-alert-after=1h
