# 통합 테스트 공통 설정(@PreorderIntegrationTest · @SqsIntegrationTest 의 test 프로필).
# 운영 application.yml 은 저장소에 없고, 로컬에 있어도 이 프로필 값이 앞선다.

# 격리 수준 — 빠뜨리면 MySQL 기본값 REPEATABLE READ 로 돌아 운영과 다른 잠금 동작을 검증하게 된다
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.threads.virtual.enabled=true

# 스키마는 운영 배포와 같은 flyway-project/migrations 로 만든다(flyway-project/flyway.toml 과 맞춘다)
spring.flyway.locations=filesystem:${nova.migrations-path}
spring.flyway.default-schema=shop
spring.flyway.schemas=shop
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# 발행은 로그로, 소비기는 끈다. 로그 전송은 보내지 않고 발행 완료로 표시하므로 허용을 함께 적는다(시험 전용).
# 릴레이 · 미발행 현황은 주기를 길게 두고, 배선을 보는 시험만 주기를 줄인다
nova.outbox.transport=log
nova.outbox.log-transport-allowed=true
nova.outbox.relay-interval=1h
nova.sqs.consumer.enabled=false
# 상태 지표는 테스트가 직접 갱신한다
nova.metrics.refresh-interval=1h

# 운영과 같은 관측 엔드포인트(application.yml.example 의 management 와 맞춘다)
management.endpoints.web.exposure.include=health,prometheus

# 토큰 검증. 공개키는 SecurityTestConfig 가 AccessTokens 의 키로 넣는다(발급 기간 값은 검증 서비스도 필수)
jwt.issuer=nova
