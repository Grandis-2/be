rootProject.name = 'nova'

// 공통 라이브러리 — 의존하는 모듈이 서로 다르다
include 'common:types'      // 전부
include 'common:web'        // HTTP 서비스 4개
include 'common:message'    // preorder · order · worker
include 'common:redis'      // member · catalog · preorder
include 'common:security'   // HTTP 서비스 4개 — JWT 검증
include 'common:jpa'        // order — 저장 해상도 시계 · JPA Auditing (자동설정)

// HTTP 진입점 — ECS 서비스
include 'member'      // 카카오 로그인 · JWT · 회원
include 'catalog'     // 상품 · 옵션 · 관리자 등록/편집
include 'preorder'    // 접수 · 순번 · 회차 · 배송 차수 · 예약 취소
include 'order'       // 주문 · 결제기록 · 재고 · 장바구니

// 비 HTTP 진입점 — ECS 서비스
include 'worker'      // SQS 소비 — 외부 예약 등록 · 알림
include 'batch'       // 만료 스캔 · 정합성 검사 (desired 1)
