// 테스트 지원 코드. 서비스는 testImplementation 으로만 의존한다 — implementation 으로 걸면 운영 jar 에 들어간다.
// java-test-fixtures 가 아니라 일반 모듈인 것은 특정 모듈의 타입에 묶인 픽스처가 아니어서다.
apply plugin: 'java-library'

dependencies {
    // EntityIds 가 엔티티를 훑는다. 쓰는 서비스 시험에는 이미 있어 실행 시점에 끌어오지 않는다
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.springframework:spring-context'
    testImplementation 'jakarta.persistence:jakarta.persistence-api'
}
