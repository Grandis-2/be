// Redis 를 쓰는 모듈만 의존한다 (member · catalog · preorder · order · payment — catalog · preorder 는 common:security 를 거쳐).
// worker · batch 는 쓰지 않고, waitingroom 은 전용 Redis 를 reactive 로 따로 쓴다.
// 의존하면 기동 때 공유 연결을 미리 열고 PING 한다(RedisWarmupAutoConfiguration) — 첫 요청이 연결을 열다 실패하지 않게.
// 읽기 캐시(ReadCache)는 쓰는 서비스가 빈으로 직접 만든다(catalog · order) — 자동설정으로 켜지 않는다.
apply plugin: 'java-library'

dependencies {
    api project(':common:types')
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    // 읽기 캐시: 값은 JSON(Jackson 3), Redis 장애 차단기는 resilience4j 코어만(스프링 연동 없이 코드로 만든다)
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation "io.github.resilience4j:resilience4j-circuitbreaker:${rootProject.resilience4jVersion}"   // 버전은 루트 build.gradle
    // Redis 장애 중에 쓰는 이 인스턴스의 사본(ReadCache.OutageCopies) — 버전은 Spring Boot 가 정한다
    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
