// 모든 모듈이 의존한다. spring-web · security 를 끌어오지 않는다.
apply plugin: 'java-library'

dependencies {
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-jpa'          // Auditing 애너테이션
    api 'org.springframework.boot:spring-boot-starter-validation'
    // BaseEntity 의 @UuidGenerator. 엔티티를 쓰는 모듈은 JPA 로 이미 갖고 있어 실행 시점에 끌어오지 않는다
    compileOnly 'org.hibernate.orm:hibernate-core'
}
