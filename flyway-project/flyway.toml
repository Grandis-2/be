[environments.default]
schemas = ["shop"]

[flyway]
locations = ["filesystem:migrations"]
defaultSchema = "shop"
# DB 생성과 계정 · 권한은 인프라(nova-infra ncp/database)가 만든다.
createSchemas = false
cleanDisabled = true
baselineOnMigrate = false
outOfOrder = false
validateOnMigrate = true
validateMigrationNaming = true
# locations 의 경로가 없으면 실패한다. 운영 이미지(Dockerfile)에 경로를 빠뜨리면 그 마이그레이션을 건너뛴 채 성공하지 않게.
failOnMissingLocations = true
# 기본값인 future 무시도 끈다. 오래된 배포본으로 실행하면 실패해야 한다.
ignoreMigrationPatterns = []
