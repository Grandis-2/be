# 통합 테스트 공통 설정(BatchIntegrationTest 의 test 프로필).
# 운영 application.yml 은 저장소에 없고, 로컬에 있어도 이 프로필 값이 앞선다.

# 격리 수준 — 빠뜨리면 MySQL 기본값 REPEATABLE READ 로 돌아 운영과 다른 동작을 검증하게 된다
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 스키마는 운영 배포와 같은 flyway-project/migrations 로 만든다(flyway-project/flyway.toml 과 맞춘다)
spring.flyway.locations=filesystem:${nova.migrations-path}
spring.flyway.default-schema=shop
spring.flyway.schemas=shop
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# 주기 작업 · 기동 정리는 끄고 시험이 서비스를 직접 부른다. Mock 주소는 BatchIntegrationTest 가 가짜 Mock 으로 넣는다
nova.batch.reconciliation.scheduling-enabled=false
external.mock.page-size=2
# 일시 실패 뒤 다시 받기는 기본 횟수(2번) 그대로, 기다림만 줄인다
external.mock.retry-delay=10ms
# 사진 정리도 주기 작업을 끄고 시험이 서비스를 직접 부른다. 실제 삭제(dry-run=false)를 보는 시험은 클래스에서 켠다
nova.batch.image-cleanup.scheduling-enabled=false
