# 로컬 문서 허브. 호스트에서 뜬 네 서비스를 한 출처(localhost:9000)로 묶는다. Swagger UI 는 member(허브)가 내고,
# 드롭다운의 각 문서와 Try it out 호출은 아래 경로 규칙대로 서비스에 간다. 로컬 전용이다 — TLS · 접근 제어 · Host 정책이 없다.
# dev 에는 쓰지 않는다(dev 는 ALB 가 같은 경로 규칙을 맡는다).
#
#   docker run --rm -p 127.0.0.1:9000:80 --add-host=host.docker.internal:host-gateway \
#     -v "$PWD/docker/openapi-hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
#   → http://localhost:9000/swagger-ui/index.html
#
# 서비스는 문서를 켜고 떠 있어야 한다(springdoc.api-docs.enabled · swagger-ui.enabled = true). member 에는
# nova.openapi.hub-services=member,catalog,preorder,order 도 준다. /api/v1 규칙은 member · catalog · order 는 현재 컨트롤러 기준이고 preorder 는 가정이다.
# products 아래의 preorder · order 경로(배송 차수 · 사전예약 회차 · 재고)도 아직 catalog 로 간다.

upstream member   { server host.docker.internal:8080; }
upstream catalog  { server host.docker.internal:8082; }
upstream preorder { server host.docker.internal:8083; }
upstream order    { server host.docker.internal:8084; }

server {
    listen 80;

    # 서비스별 그룹 문서
    location = /v3/api-docs/member   { proxy_pass http://member; }
    location = /v3/api-docs/catalog  { proxy_pass http://catalog; }
    location = /v3/api-docs/preorder { proxy_pass http://preorder; }
    location = /v3/api-docs/order    { proxy_pass http://order; }

    # UI 와 그 설정은 허브(member)
    location /swagger-ui                   { proxy_pass http://member; }
    location = /v3/api-docs/swagger-config { proxy_pass http://member; }

    # Try it out 호출
    location ~ ^/api/v1/(admin/)?orders(/|$)    { proxy_pass http://order; }
    location ~ ^/api/v1/(admin/)?products(/|$)  { proxy_pass http://catalog; }
    location ~ ^/api/v1/(reviews|categories)(/|$) { proxy_pass http://catalog; }   # 상품 리뷰 · 카테고리
    location ~ ^/api/v1/(admin/)?preorders(/|$) { proxy_pass http://preorder; }
    location /api/v1/                           { proxy_pass http://member; }   # 인증 · 세션 · 내 정보
    location /.well-known/                      { proxy_pass http://member; }
}
