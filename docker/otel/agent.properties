# OpenTelemetry Java 에이전트 설정. 이미지가 OTEL_JAVAAGENT_CONFIGURATION_FILE 로 가리키고, 에이전트를 켠 서비스만 읽는다
# (켜는 건 nova-infra 작업 정의의 JDK_JAVA_OPTIONS). 같은 키의 환경 변수(OTEL_INSTRUMENTATION_<이름>_ENABLED)가 이 파일보다 우선한다.
#
# 쓰지 않는 계측을 끈다. 에이전트는 클래스를 실을 때마다 켜진 계측 전부와 대조해서, 끄면 그만큼 기동이 준다
# (NV-452 실측: preorder readiness 약 −3~4초. span · 지표 · 로그 레코드는 그대로). 계측 하나하나의 몫은 작고 합이 커서 목록이 길다.
#
# 항목마다 바로 위 줄에 다시 켜야 하는 조건을 적는다. CI(.github/scripts/otel_agent_config.py)가 PR 마다 확인한다.
#   # jar: <artifact id 정규식>  서비스 이미지(BOOT-INF/lib)에 이 jar 가 생기면 실패 — 그 항목을 지워 계측을 켠다
#   # src: <정규식>              main 소스에 이 패턴이 생기면 실패 — JDK 내장 · 애너테이션처럼 jar 로는 알 수 없는 것
#   # 의도적: <이유>             라이브러리가 있어도 끈다
# 계측 이름은 docker/Dockerfile 이 고정한 에이전트에 있어야 한다 — 에이전트를 올려 이름이 바뀌면 CI 가 실패한다.

