# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# nova 코드 리뷰 설정
#
# 구조: 전역 원칙(**/*.java) → 서비스 모듈별 규칙 → 공통 모듈 · 빌드 · 테스트 · 설정 · CI
# 규칙은 "무엇을 지적할 것"으로만 쓴다. 테이블 · 칼럼 이름처럼 코드에서 대조할 수 있는 단서를 남긴다.
# 스타일 · 포맷은 리뷰 대상이 아니다. 정확성과 경계 위반만 본다.
#
# 소유 경계(README 기준)
#   member    customers
#   catalog   categories · products · product_variants(재고 칼럼 제외)
#   preorder  preorders · preorder_events · preorder_campaigns · shipment_batches
#   order     orders · order_items · order_events · cart_items · payments · payment_transactions
#             product_variants 의 재고 칼럼(stock_total · stock_reserved · stock_sold)
#   worker    preorder_sync_jobs · preorder_sync_attempts (실행 주체. 행 생성은 preorder)
#   batch     읽기 전용
#
# 테이블 이름이 바뀌면 이 주석과 아래 모듈 지시문을 함께 고친다.

language: "ko-KR"

tone_instructions: |
  한국어로, 근거를 먼저 말하고 수정안을 제시한다.
  추측이면 추측이라고 밝힌다. 확실하지 않은 지적은 질문 형태로 남긴다.
  취향 차이(네이밍 선호, 줄바꿈, 주석 스타일)는 언급하지 않는다.

reviews:
  profile: "assertive"          # 정확성 위주. 지적이 많다고 느끼면 chill 로 낮춘다
  request_changes_workflow: true # 지적이 있으면 변경 요청, 모두 해결되면 승인 — 머지 규칙의 승인 1건으로 쓴다
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true       # 접수 → 외부 등록 → 확정 흐름을 눈으로 확인하는 데 쓴다
  estimate_code_review_effort: true
  assess_linked_issues: true
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    labels:
      - "!skip-review"
    auto_incremental_review: true
    drafts: false
    # 에픽 브랜치는 커밋이 길게 쌓인다. 기본값(5)이면 중간에 리뷰가 멈춘다
    auto_pause_after_reviewed_commits: 20
    # 작업 브랜치는 에픽으로, 에픽은 main 으로 올라온다
    base_branches:
      - "main"
      - "epic/.*"
    ignore_title_keywords:
      - "wip"
      - "[skip review]"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!**/*.lock"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"

  path_instructions:
    # ─────────────────────────────────────────────────────────────
    # 0. 전역 — 이 프로젝트가 무엇을 지키려 하는지
    # ─────────────────────────────────────────────────────────────
    - path: "**/*.java"
      instructions: |
        # 이 시스템이 지키려는 것
        오픈 순간 신청이 몰려도 유실 0 · 외부 중복 등록 0 · 모든 예약이 최종 상태 도달.
        세 가지는 서로 다른 사건이다: 접수 완료 ≠ 외부 등록 확정 ≠ 결제 완료.
        일시적인 외부 호출 실패는 예약의 최종 실패가 아니다.

        # 반드시 지적할 것 (정확성)
        - 사용자 요청을 처리하는 경로(@RestController → @Service)에서 외부 HTTP 호출을 기다리는 코드.
          외부 호출은 워커가 한다.
        - @Transactional 범위 안의 HTTP 호출 · SQS 전송 · Thread.sleep · 외부 락 대기.
          DB 잠금을 외부 응답 시간만큼 붙잡는다.
        - 조건부 UPDATE 의 결과(영향 행 수)를 확인하지 않고 성공으로 간주하는 코드.
          "1행이 바뀌었을 때만 업무가 일어났다"가 이 프로젝트의 기본 판정 방식이다.
        - SELECT 로 확인한 뒤 INSERT · UPDATE 하는 check-then-act.
          동시 요청에서 깨진다. UNIQUE 제약이나 조건부 UPDATE 로 바꿀 것을 제안한다.
        - 재시도 · 중복 수신에서 업무 효과가 두 번 일어나는 경로.
          메시지는 최소 1회 전달이고 중복이 정상이다.
        - 응답을 받지 못한 외부 호출을 "실패" 또는 "미등록"으로 단정하는 코드.
          결과 불명은 별도 상태로 두고 같은 키로 조회해 확정한다.
        - 예외를 삼키는 catch, 로그만 남기고 흘려보내는 처리.
        - 내부 예외 메시지 · 스택트레이스 · SQL 을 사용자 응답으로 내보내는 코드.
        - 토큰 · 카카오 식별자 · 결제 키를 로그에 남기는 코드.

        # 시각 · 금액
        - 저장은 UTC, 화면 표시만 KST. LocalDateTime.now() 로 시스템 기본 시간대에 의존하면 지적한다.
        - 금액은 정수(원 단위). float · double 사용은 지적한다.

        # 지적하지 말 것
        - 포맷팅, import 순서, 줄바꿈, 변수명 취향, 주석 유무.
        - 테스트가 없다는 사실 자체(테스트 규칙은 src/test 경로에서 따로 본다).

    # ─────────────────────────────────────────────────────────────
    # 1. preorder — Core. 접수 · 순번 · 배송 차수 · 예약 상태
    # ─────────────────────────────────────────────────────────────
    - path: "preorder/**/*.java"
      instructions: |
        # 접수 트랜잭션(이 순서를 벗어나면 지적)
        1) preorder_campaigns 행 잠금(SELECT ... FOR UPDATE 또는 조건부 UPDATE)
        2) 같은 접수 키(customer_id, idempotency_key) 확인
        3) 순번 발급 · 배송 차수 배정
        4) preorders INSERT
        5) preorder_events INSERT (첫 이력)
        6) preorder_sync_jobs INSERT (등록 작업)
        → 커밋 후 응답. 이 트랜잭션 안에 외부 HTTP 호출이 있으면 지적한다.

        # 불변식
        - 순번은 preorder_campaigns.next_queue_position 을 잠그고 증가시켜 발급한다.
          MAX(queue_position)+1, AUTO_INCREMENT, 애플리케이션 카운터, Redis INCR 로 대체하면 지적한다.
        - 모델당 활성 예약 1건은 UNIQUE(customer_id, product_id, active_marker) 로 막는다.
          조회 후 INSERT 로만 막으면 지적한다.
        - 같은 접수 키 + 같은 내용 → 기존 예약 반환(새 순번 금지).
          같은 키 + 다른 모델/옵션 → 거절. 이 분기가 없으면 지적한다.
        - 배송 차수는 접수 순번과 구간으로 계산한다.
          외부 등록 성공 순서 · 확정 시각으로 배정하면 지적한다.
        - 모집 오픈 이후 배송 기준(shipment_batches)과 기존 배정을 바꾸는 코드는 지적한다.
        - 예약 상태 변경은 "현재 상태를 조건으로 한 UPDATE + preorder_events INSERT"를
          같은 트랜잭션에서 한다. 이력 없이 상태만 바꾸면 지적한다.
        - DLQ(preorder_sync_jobs.status = DEAD_LETTER) 진입을 예약 최종 실패로 바꾸는 코드는 지적한다.

        # 경계
        - orders · order_items · payments · payment_transactions · cart_items 는 읽기도 지적한다.
          결제 가능 여부는 order 의 API 로 답하고, 결과는 이벤트로 받는다.
        - product_variants 는 읽기만 허용한다. 쓰기(INSERT · UPDATE · DELETE)면 지적한다.
        - 접수 시 상품명 · 옵션명 · 가격은 예약 행에 복사한다. 매번 카탈로그를 조회해 표시하면 지적한다.

        # 정해진 것(ERD v13)
        - 사전예약은 재고를 선점하지 않는다(결정 3). 사전예약 옵션의 재고를 차감 · 확보하면 지적한다.
        - 취소가 끝난 뒤 재신청하면 새 순번을 받는다(preorders.queue_position). 기존 순번을 재사용하면 지적한다.
          재신청은 새 접수 키로 한다. 같은 접수 키는 취소된 예약도 포함해 기존 예약을 돌려준다
          (uq_preorder_idempotency 는 취소 행을 포함한다). 같은 키로 새 예약을 만들면 지적한다.

    # ─────────────────────────────────────────────────────────────
    # 2. order — 주문 · 결제 기록 · 재고 · 장바구니
    # ─────────────────────────────────────────────────────────────
    - path: "order/**/*.java"
      instructions: |
        # 경계
        - preorders · preorder_events 를 쓰기(UPDATE · INSERT)하면 지적한다.
          예약 상태를 바꾸는 주체는 preorder 다. 결제 결과는 이벤트로 알린다.
        - product_variants 는 재고 칼럼(stock_total · stock_reserved · stock_sold)만 변경할 수 있다.
          그 외 칼럼(title · price · status)을 변경하면 지적한다.

        # 결제
        - 승인 · 환불 요청에 멱등 키가 없으면 지적한다. 재시도는 같은 키로 한다.
        - 결과 불명(타임아웃 · 응답 없음)을 실패로 단정하고 새 키로 다시 청구 · 환불하는 코드는 지적한다.
        - 결제 금액은 서버가 계산한 값으로 검증한다. 클라이언트가 보낸 금액을 그대로 쓰면 지적한다.
        - 결제 성공 반영(주문 상태 전이 + payments INSERT + 재고 확정)은 한 트랜잭션에서 한다.

        # 재고
        - 차감은 조건부 UPDATE 한 번으로 한다.
          예: UPDATE ... SET stock_reserved = stock_reserved + ?
              WHERE id = ? AND stock_total - stock_reserved - stock_sold >= ?
          영향 행 0 을 품절로 처리한다. SELECT 로 읽어 계산한 뒤 UPDATE 하면 지적한다.
        - 반환은 한 번만 일어나야 한다(stock_released_at 이 비어 있을 때만).
          중복 반환을 막는 조건이 없으면 지적한다.

        # 취소
        - 예약 취소 완료 판정은 preorder 가 한다. order 는 환불 결과만 알린다.
          order 에서 예약을 CANCELED 로 바꾸면 지적한다.

    # ─────────────────────────────────────────────────────────────
    # 3. worker — 외부 등록 · 알림. 유실과 중복이 갈리는 곳
    # ─────────────────────────────────────────────────────────────
    - path: "worker/**/*.java"
      instructions: |
        # 작업 선점
        - 선점은 FOR UPDATE SKIP LOCKED 또는 리스 토큰 방식으로 한다.
          여러 워커가 같은 작업을 집을 수 있는 코드는 지적한다.
        - 결과 반영 UPDATE 에 lease_token(또는 소유권) 조건과 영향 행 수 확인이 없으면 지적한다.
          리스가 만료돼 다른 워커가 이어받은 뒤 늦게 끝난 워커가 덮어쓴다.
        - 리스 만료 시각이 외부 호출 타임아웃보다 짧으면 지적한다.

        # 외부 호출
        - preorder_sync_attempts 행을 호출 **전에** 기록하고 커밋하지 않으면 지적한다.
          프로세스가 죽으면 시도 흔적이 사라진다.
        - 재시도에 같은 external_key 와 고정된 요청 본문을 쓴다. 새 키를 만들면 지적한다.
        - 응답 없음을 미등록으로 단정하지 않는다. UNKNOWN 으로 남기고 같은 키로 조회해 확정한다.
        - 타임아웃(연결 · 읽기) 설정이 없는 HTTP 클라이언트는 지적한다.
        - 재시도 간격이 고정이면 지적한다. 지수 증가 + 지터 + 상한.
        - 자동 재시도 소진은 DEAD_LETTER 로 보낸다. 예약을 실패로 바꾸면 지적한다.

        # 메시지
        - SQS 는 중복 전달이 정상이다. 소비 처리가 멱등하지 않으면 지적한다.
        - 메시지 본문의 값을 그대로 신뢰해 업무를 판단하면 지적한다.
          메시지는 깨우기 신호로 쓰고 원장(DB)을 다시 읽는다.
        - 처리 실패 시 메시지를 조용히 삭제하면 지적한다.

        # 알림
        - 알림 발송 실패가 예약 · 결제 트랜잭션을 되돌리면 지적한다.
        - 같은 사건의 중복 발송을 막는 키가 없으면 지적한다.

    # ─────────────────────────────────────────────────────────────
    # 4. batch — 만료 스캔 · 정합성 검사. 단일 실행 전제
    # ─────────────────────────────────────────────────────────────
    - path: "batch/**/*.java"
      instructions: |
        - 동시 실행 방지 장치(락 · 단일 실행 표식)가 없으면 지적한다. desired 1 전제로 설계돼 있다.
        - 정합성 검사는 읽기 전용이다. 업무 테이블이나 external_mock 스키마에 쓰기를 하면 지적한다.
          조치는 정상 업무 경로(API · 이벤트)로 한다.
        - 조회 실패 · 권한 오류가 있는 실행을 "불일치 0" 으로 집계하면 지적한다. 검사 미완료로 남긴다.
        - 정상 처리 중인 차이(접수 직후 · 등록 진행 중)를 불일치로 세면 지적한다. 기준 시각이 필요하다.
        - 전체 로드 후 메모리에서 처리하면 지적한다. 커서 · 청크로 끊는다.
        - 결제 기한 만료 자동 취소는 정책이 미정이다. 임의 구현이면 질문으로 남긴다.

    # ─────────────────────────────────────────────────────────────
    # 5. catalog — 무엇을 파는가
    # ─────────────────────────────────────────────────────────────
    - path: "catalog/**/*.java"
      instructions: |
        - 재고 칼럼(stock_total · stock_reserved · stock_sold)은 읽기만 허용한다. 변경하면 지적한다.
        - preorders · orders · payments 는 읽기도 지적한다.
        - sku 는 모델 안에서 유일하다. 중복 검사를 애플리케이션 조회로만 하면 UNIQUE 제약을 함께 쓰도록 제안한다.
        - 상품 · 옵션의 물리 삭제는 지적한다. 신청 이력이 있으므로 상태로 숨긴다.
        - 모집 오픈 이후 모집 일정 · 배송 기준을 바꾸는 경로는 지적한다.
        - 가격 · 이름 변경이 과거 예약에 소급되는 구조라면 지적한다. 예약은 접수 시점 값을 복사해 쓴다.

    # ─────────────────────────────────────────────────────────────
    # 6. member — 로그인 · 토큰 · 회원
    # ─────────────────────────────────────────────────────────────
    - path: "member/**/*.java"
      instructions: |
        - customers 외 테이블은 읽기도 지적한다.
        - 리프레시 토큰을 원문으로 저장하면 지적한다. 해시만 저장한다.
        - 리프레시 회전 시 이전 토큰을 무효화하지 않으면 지적한다. 재사용 감지 시 같은 체인 전체를 폐기한다.
        - 서명 키 · 카카오 시크릿이 코드나 기본 설정값에 들어 있으면 지적한다.
        - 액세스 토큰 값을 로그 · 응답 · URL 쿼리에 남기면 지적한다.
        - 카카오 응답을 그대로 엔티티에 매핑하면 지적한다. 필요한 필드만 변환한다.
        - 인증 실패 응답이 "없는 계정"과 "잘못된 자격"을 구분해 알려주면 지적한다.

    # ─────────────────────────────────────────────────────────────
    # 7. common — 공통 라이브러리
    # ─────────────────────────────────────────────────────────────
    - path: "common/**/*.java"
      instructions: |
        - 특정 도메인 개념(예약 · 주문 · 결제 · 상품)이 공통 모듈에 들어오면 지적한다.
          공통은 응답 포맷 · 예외 · 커서 · 메시지 계약 · 인증 검증까지다.
        - 서비스 모듈(member · catalog · preorder · order · worker · batch)을 참조하면 지적한다.
        - common:types 에 웹 · JPA 구현 의존이 새로 들어오면 지적한다. 사용하는 모듈이 제한된다.
        - 공통 예외 · 에러 코드를 바꾸면 사용하는 서비스 전체에 영향이 간다. 영향 범위를 PR 설명에 적도록 요청한다.

    # ─────────────────────────────────────────────────────────────
    # 8. 빌드 · 모듈 경계
    # ─────────────────────────────────────────────────────────────
    - path: "**/build.gradle"
      instructions: |
        - 서비스 모듈끼리 직접 의존(예: preorder 가 order 를 project 의존)하면 지적한다.
          모듈 경계가 무너진다. 공유가 필요하면 common 으로 올리거나 API · 이벤트로 통신한다.
        - 라이브러리 버전을 개별 하드코딩하면 지적한다. Spring BOM 이 관리하는 것은 버전을 적지 않는다.
        - 새 의존성 추가는 용도를 주석이나 PR 설명으로 남기도록 요청한다.
        - implementation 으로 충분한 것을 api 로 노출하면 지적한다.

    - path: "settings.gradle"
      instructions: |
        - 모듈 추가 · 삭제는 서비스 경계 변경이다. 근거를 PR 설명에 적도록 요청한다.
        - 선언만 되고 아무도 의존하지 않는 모듈이 생기면 지적한다(현재 common:security · common:redis 가 그렇다).

    # ─────────────────────────────────────────────────────────────
    # 9. 테스트
    # ─────────────────────────────────────────────────────────────
    - path: "**/src/test/**/*.java"
      instructions: |
        - 정상 경로만 검증하는 테스트에는 실패 · 동시성 경로를 함께 요청한다.
          이 프로젝트에서 중요한 것은 같은 키 동시 재전송, 재시도 중복, 중단 후 복구다.
        - DB 동작(SKIP LOCKED · UNIQUE 충돌 · 조건부 UPDATE 영향 행 수)을 검증하는 테스트가
          H2 등 다른 엔진에서 돌면 지적한다. MySQL 로 검증해야 의미가 있다.
        - 고정된 sleep 으로 비동기를 기다리면 지적한다. 조건 대기로 바꾼다.
        - 테스트끼리 데이터를 공유해 실행 순서에 의존하면 지적한다.
        - 단정 없이 실행만 하는 테스트는 지적한다.

    # ─────────────────────────────────────────────────────────────
    # 10. 설정 · CI
    # ─────────────────────────────────────────────────────────────
    - path: "**/src/main/resources/**"
      instructions: |
        - 비밀번호 · 토큰 · 키가 설정 파일에 값으로 들어 있으면 지적한다. 환경 변수나 시크릿에서 읽는다.
        - 커넥션 풀 크기 · 타임아웃이 기본값 그대로면 지적한다. 접수 경로의 처리량을 좌우한다.
        - ddl-auto 가 update · create 로 설정되면 지적한다. 스키마는 마이그레이션으로만 바꾼다.
        - show-sql 이 켜진 채 병합되면 지적한다.

    - path: ".github/workflows/**"
      instructions: |
        - 시크릿을 로그로 출력하거나 PR 이벤트에서 시크릿을 쓰는 설정은 지적한다.
        - 액션은 태그 대신 커밋 SHA 로 고정하도록 제안한다.
        - permissions 를 명시하지 않으면 최소 권한으로 지정하도록 제안한다.
        - 테스트 · 린트 단계를 건너뛰는 변경은 근거를 묻는다.

  # 라벨은 제안만 한다. 자동 부착은 하지 않는다
  labeling_instructions:
    - label: "preorder"
      instructions: "preorder 모듈이 바뀌면 제안한다"
    - label: "order"
      instructions: "order 모듈이 바뀌면 제안한다"
    - label: "worker"
      instructions: "worker 모듈이 바뀌면 제안한다"
    - label: "infra"
      instructions: "build.gradle · settings.gradle · .github 가 바뀌면 제안한다"
    - label: "breaking-boundary"
      instructions: "모듈이 자기 소유가 아닌 테이블을 읽거나 쓰는 변경이면 제안한다"
  auto_apply_labels: false

  # 머지 전 점검. 지금은 경고로만 두고, 팀이 익숙해지면 error 로 올린다
  pre_merge_checks:
    title:
      mode: "warning"
      requirements: |
        형식은 <type>(<이슈 키>): <요약> 이다. 예: feat(NV-7): 사전예약 접수 API 추가
        type 은 feat · fix · refactor · test · docs · chore 중 하나.
        요약은 한국어이고 마침표로 끝내지 않는다.
        에픽 → main PR 은 이슈 키 대신 에픽 키를 쓴다.
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "모듈 경계"
        mode: "warning"
        instructions: |
          쓰기(INSERT · UPDATE · DELETE)와 읽기(SELECT)를 나눠서 판정한다.
          소유 경계는 파일 상단 주석을 따른다.

          다음이면 실패로 표시한다.
          - 서비스 모듈이 자기 소유가 아닌 테이블에 쓰기를 한다
          - preorder 또는 catalog 가 product_variants 의 재고 칼럼
            (stock_total · stock_reserved · stock_sold)을 변경한다
          - order 가 product_variants 의 재고 칼럼 외(title · price · status 등)를 변경한다
          - build.gradle 에 서비스 모듈끼리의 project 의존이 추가됐다

          - 아래 "허용된 읽기"에 없는 비소유 테이블을 읽는다
            (모듈별 지시문이 금지한 읽기가 우선한다. 예: preorder 의 payments 조회,
             catalog 의 preorders 조회, member 의 customers 외 테이블 조회)

          허용된 읽기 — 이것만 실패가 아니다.
          - preorder → products · product_variants · categories (접수 시점 값 복사)
          - order → products · product_variants (금액 · 재고 확인)
          - worker → preorders (처리 대상 확인)
          - batch → 전부 (읽기 전용 모듈)

          허용된 쓰기 예외 — 실패가 아니다.
          - order 가 product_variants 의 재고 칼럼만 조건부 UPDATE 로 변경한다

          위 조건에 해당하지 않으면 통과로 표시한다.
      - name: "동시성 안전"
        mode: "warning"
        instructions: |
          접수 · 재고 차감 · 작업 선점 · 결제 반영 코드가 바뀐 PR 에서 다음이면 실패로 표시한다.
          - 조회 후 변경(check-then-act) 으로 동시성을 막고 있다
          - 조건부 UPDATE 의 영향 행 수를 확인하지 않는다
          - 재시도 · 중복 수신에서 업무 효과가 두 번 일어날 수 있다
          해당 코드가 바뀌지 않았으면 통과로 표시한다.

  tools:
    # 켠다 — 비용 대비 효과가 확실한 것
    gitleaks: { enabled: true }         # 시크릿 (CI 의 gitleaks 와 중복이지만 PR 단계에서 먼저 잡는다)
    actionlint: { enabled: true }       # 워크플로 문법
    zizmor: { enabled: true }           # 워크플로 보안
    yamllint: { enabled: true }
    osvScanner: { enabled: true }       # 의존성 취약점
    github-checks: { enabled: true }    # CI 결과를 리뷰 맥락으로 사용
    # 끈다 — 규칙 파일 없이 켜면 지적이 쏟아져 리뷰를 안 읽게 된다
    pmd: { enabled: false }             # 규칙 파일을 만든 뒤 config_file 과 함께 켠다
    semgrep: { enabled: false }
    opengrep: { enabled: false }
    ast-grep: { enabled: false }
    # 끈다 — 한국어 문서 · 테스트 데이터에서 오탐이 많다
    languagetool: { enabled: false }
    vale: { enabled: false }
    markdownlint: { enabled: false }
    presidio: { enabled: false }
    trufflehog: { enabled: false }      # gitleaks 와 겹친다

# 테스트 생성 시 지침 (🧪 체크박스로 실행할 때 적용)
code_generation:
  docstrings:
    language: "ko-KR"
  unit_tests:
    path_instructions:
      - path: "**/*.java"
        instructions: |
          정상 경로와 함께 실패 · 동시성 경로를 만든다.
          같은 접수 키 동시 재전송, 같은 작업의 중복 선점, 재시도 중복 반영, 중단 후 재시작.
          DB 제약 · 잠금 동작을 검증하는 테스트는 MySQL(Testcontainers)에서 돌린다.
          sleep 으로 비동기를 기다리지 않는다.

chat:
  auto_reply: true
  art: false

knowledge_base:
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
