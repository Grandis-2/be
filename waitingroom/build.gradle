apply plugin: 'org.springframework.boot'

// 입장 대기열. 판정 · 줄 서기는 WebFlux 이벤트 루프에서 Redis 스냅샷으로 한다.
// common:web · common:security 는 servlet 전용이라 의존하지 않는다 — 서블릿 필터 · MVC 설정이 리액티브 앱에서 동작하지 않는다.

// Spring Boot BOM 이 관리하지 않는 라이브러리 버전. 올릴 때 여기만 바꾼다(preorder 와 같은 값).
ext {
    archunitVersion = '1.5.1'
    // Spring Boot 4.1 을 지원하는 첫 릴리스 트레인은 2025.1.2 다
    springCloudVersion = '2025.1.3'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation project(':common:types')
    // 회차 일정 수신(waitingroom-events) · 재발행 요청(preorder-events). 봉투 모양은 서비스들과 같은 계약이다
    implementation project(':common:sqs')
    implementation project(':common:message')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // 접수 POST 를 입장권 확인 뒤 preorder 로 그대로 전달한다
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // 액세스 토큰 검증(RS256 · JWKS). 발급은 member 가 한다
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    // member JWKS 를 받는 WebClient(자동설정 빌더 — 지표 · 코덱 설정을 같이 받는다)
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    // 대기열 · 판정 재료. 요청 경로와 제어 루프 모두 리액티브로 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // Reactor 컨텍스트의 traceId 를 로그 MDC 로 옮긴다
    implementation 'io.micrometer:context-propagation'

    testImplementation 'io.projectreactor:reactor-test'
    // SQS 연계는 로컬 AWS 에뮬레이터 Floci 로 검증한다(서비스들과 같은 픽스처)
    testImplementation testFixtures(project(':common:sqs'))
    // Lua · 제어 평면은 실제 Redis 로만 검증한다(CI 와 같은 redis:8)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // 모듈 경계 규칙(ModuleBoundaryTest)
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}
